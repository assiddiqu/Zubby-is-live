<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel (Firebase)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        .admin-panel { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 8px; }
        button { padding: 10px 15px; margin-top: 10px; }
        .post-list { margin-top: 30px; }
        .post-item { padding: 10px; border: 1px solid #ddd; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body><div class="admin-panel">
    <h2>Admin Panel</h2>

    <div class="form-group">
        <label for="siteTitle">Website Title</label>
        <input type="text" id="siteTitle" placeholder="Enter website title">
        <button onclick="updateSiteTitle()">Update Title</button>
    </div>

    <div class="form-group">
        <label for="postTitle">New Post Title</label>
        <input type="text" id="postTitle" placeholder="Enter post title">
    </div>

    <div class="form-group">
        <label for="fileUpload">Upload File</label>
        <input type="file" id="fileUpload">
    </div>

    <button onclick="addPost()">Add Post</button>

    <div class="post-list" id="postList">
        <h3>Posts</h3>
    </div>
</div>

<script>
    // TODO: Replace with your own Firebase config
    const firebaseConfig = {
        apiKey: "AIzaSyABa8ERq4kkvqbkzHgJ_cXJVW-F-U-wbyU",
        authDomain: "dork-hub.firebaseapp.com",
        databaseURL: "https://dork-hub-default-rtdb.firebaseio.com",
        projectId: "dork-hub",
        storageBucket: "dork-hub.firebasestorage.app",
        messagingSenderId: "143650381570",
        appId: "1:143650381570:web:961e22f165dcd29e0b2c1b"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function updateSiteTitle() {
        const title = document.getElementById('siteTitle').value;
        if (title) {
            db.ref('siteTitle').set(title);
            alert('Website title updated!');
        }
    }

    function addPost() {
        const title = document.getElementById('postTitle').value;
        const fileInput = document.getElementById('fileUpload');

        if (title && fileInput.files.length > 0) {
            const postId = db.ref().child('posts').push().key;
            const postData = { id: postId, title: title };

            db.ref('posts/' + postId).set(postData);
            alert('Post added!');
        } else {
            alert('Please add a title and upload a file.');
        }
    }

    function deletePost(id) {
        db.ref('posts/' + id).remove();
    }

    function renderPosts(snapshot) {
        const postList = document.getElementById('postList');
        postList.innerHTML = '<h3>Posts</h3>';

        snapshot.forEach(childSnapshot => {
            const post = childSnapshot.val();
            const div = document.createElement('div');
            div.className = 'post-item';
            div.innerHTML = `<span>${post.title}</span> <button onclick="deletePost('${post.id}')">Delete</button>`;
            postList.appendChild(div);
        });
    }

    db.ref('posts').on('value', snapshot => {
        renderPosts(snapshot);
    });
</script>

</body>
</html>
